<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OscTok.Com - Log In or Sign Up</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #e7e9ea; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .auth-card { 
            background: #000; 
            border: 1px solid #2f3336; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 420px; 
            padding: 32px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }

        .brand-logo { font-size: 32px; font-weight: 800; text-align: center; color: #1d9bf0; tracking: -0.5px; margin-bottom: 8px; }
        .brand-logo span { color: #fff; }

        h2 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 10px; }

        .input-group { display: flex; flex-direction: column; gap: 12px; }

        input { 
            width: 100%; 
            background: #000; 
            border: 1px solid #333639; 
            border-radius: 8px; 
            padding: 14px 12px; 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            transition: border-color 0.2s;
        }
        input:focus { border-color: #1d9bf0; }

        .btn-primary { 
            background: #eff3f4; 
            color: #0f1419; 
            font-weight: 700; 
            padding: 14px; 
            border-radius: 25px; 
            border: none; 
            cursor: pointer; 
            font-size: 15px; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #d7dbdc; }

        .btn-admin-fill {
            background: rgba(29, 155, 240, 0.15);
            color: #1d9bf0;
            border: 1px solid #1d9bf0;
            border-radius: 20px;
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }

        .toggle-link { color: #1d9bf0; cursor: pointer; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-logo">OscTok<span>.Com</span></div>
        <h2 id="formTitle">Sign in to OscTok</h2>
        
        <div class="input-group">
            <input type="text" id="displayName" placeholder="Display Name (e.g., OscTok Admin)" style="display: none;">
            <input type="text" id="username" placeholder="Username / Email (admin@osctok.com)">
            <input type="password" id="password" placeholder="Password">
        </div>

        <button class="btn-primary" id="submitBtn" onclick="handleSubmit()">Log In</button>
        <button class="btn-admin-fill" onclick="fillAdmin()">⚡ Fill Admin Credentials</button>
        <p class="toggle-link" id="toggleMode" onclick="toggleAuth()">Don't have an account? Sign up</p>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api";
        let isSignUp = false;

        function fillAdmin() {
            document.getElementById('username').value = "admin@osctok.com";
            document.getElementById('password').value = "acu8aww112";
            if (isSignUp) {
                document.getElementById('displayName').value = "OscTok Admin";
            }
        }

        function toggleAuth() {
            isSignUp = !isSignUp;
            document.getElementById('formTitle').innerText = isSignUp ? "Create your OscTok account" : "Sign in to OscTok";
            document.getElementById('submitBtn').innerText = isSignUp ? "Sign Up" : "Log In";
            document.getElementById('displayName').style.display = isSignUp ? "block" : "none";
            document.getElementById('toggleMode').innerText = isSignUp ? "Already have an account? Log in" : "Don't have an account? Sign up";
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const displayName = document.getElementById('displayName').value.trim();

            if (!username || !password || (isSignUp && !displayName)) {
                return alert("Please fill in all required fields.");
            }

            const endpoint = isSignUp ? '/auth/signup' : '/auth/login';
            const bodyData = isSignUp ? { username, password, displayName } : { username, password };

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();

                if (data.success) {
                    if (isSignUp) {
                        alert("Account created! Please log in with your credentials.");
                        toggleAuth();
                    } else {
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                        localStorage.setItem('token', data.token);
                        window.location.href = "index.html";
                    }
                } else {
                    alert(data.error || "Authentication failed");
                }
            } catch (err) {
                alert("Could not connect to the OscTok server. Make sure `node server.js` is running.");
            }
        }
    </script>
</body>
</html>
