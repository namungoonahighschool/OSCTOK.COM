<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social & Blog Network</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #16181c;
            --border-color: #2f3336;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
            --accent-color: #1d9bf0;
            --accent-green: #00ba7c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
        }

        .sidebar {
            width: 280px;
            padding: 20px 15px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .auth-card h3 { margin-bottom: 10px; font-size: 16px; color: var(--accent-color); }
        .auth-card input, .auth-card textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #000;
            color: #fff;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-blog { background: var(--accent-green); margin-top: 5px; }

        .btn-secondary {
            background: #333;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }

        .feed {
            flex: 1;
            max-width: 650px;
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
        }

        .tab.active { color: var(--text-main); }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .composer {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .composer textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            outline: none;
            resize: none;
            height: 70px;
        }

        .composer-input-extra {
            width: 100%;
            background: #16181c;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .post {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333;
            flex-shrink: 0;
        }

        .post-body { flex: 1; }
        .post-header { display: flex; align-items: center; gap: 6px; }
        .author { font-weight: 700; }
        .handle { color: var(--text-muted); font-size: 14px; }
        .blog-badge { background: var(--accent-green); color: black; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .post-title { font-size: 20px; margin: 8px 0 4px 0; color: #fff; }
        .post-content { margin-top: 6px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }

        .post-media {
            margin-top: 10px;
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-height: 350px;
            object-fit: cover;
        }

        .post-actions {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .like-btn, .comment-btn { cursor: pointer; user-select: none; }
        .like-btn:hover { color: #f91880; }
        .comment-btn:hover { color: var(--accent-color); }

        .comments-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .comment-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .comment-box { background: #181818; padding: 8px; border-radius: 8px; flex: 1; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
        }

        .modal h2 { margin-bottom: 16px; color: var(--text-main); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }

        .tiktok-follow-btn {
            background-color: #fe2c55;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            padding: 6px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-left: auto;
        }

        .tiktok-follow-btn:hover { background-color: #e02648; }
        .tiktok-follow-btn:active { transform: scale(0.96); }

        .tiktok-follow-btn.following {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #383b40;
        }

        .tiktok-follow-btn.following:hover { background-color: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <div class="app-container">
        <nav class="sidebar">
            <div id="authSection" class="auth-card">
                <h3 id="authTitle">Login</h3>
                <input type="text" id="authDisplayName" placeholder="Display Name (e.g. Purity)" style="display:none;">
                <input type="text" id="authUsername" placeholder="Handle (e.g. @purity)">
                <input type="password" id="authPassword" placeholder="Password">
                <button onclick="handleAuth()" class="btn-primary" id="authBtn">Log In</button>
                <div style="font-size:12px; color:var(--text-muted); text-align:center; margin-top:8px; cursor:pointer;" id="authToggle" onclick="toggleAuthMode()">Don't have an account? Sign Up</div>
            </div>

            <div id="profileSection" class="auth-card" style="display: none;">
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                    <img id="profileAvatar" src="" class="avatar" alt="Avatar">
                    <div>
                        <h3 id="profileName" style="margin: 0;">User</h3>
                        <p id="profileHandle" style="color: var(--text-muted); font-size: 13px;"></p>
                    </div>
                </div>
                <p id="profileBio" style="font-size: 13px; margin-bottom: 10px; color: #ccc;"></p>
                
                <button onclick="openProfileModal()" class="btn-secondary" style="width: 100%; margin-bottom: 6px;">⚙️ Edit Profile & Avatar</button>
                <button onclick="openBlogModal()" class="btn-primary btn-blog" style="width: 100%; margin-bottom: 6px;">✍️ Write Blog Article</button>
                <button onclick="logout()" style="background: #e0245e;" class="btn-secondary">Log Out</button>
            </div>

            <div class="auth-card" style="border-color: #ff4757;">
                <h3 style="color: #ff4757;">👑 Admin Controls</h3>
                <input type="text" id="adminHandle" placeholder="Target handle (@username)">
                
                <div style="display:flex; gap: 5px; margin-bottom: 6px;">
                    <button onclick="toggleVerification(true)" style="background:#0095F6; width:50%;" class="btn-secondary">Verify</button>
                    <button onclick="toggleVerification(false)" style="background:#333; width:50%;" class="btn-secondary">Unverify</button>
                </div>

                <div style="display:flex; gap: 5px; margin-bottom: 6px;">
                    <button onclick="adminBanUser(true)" style="background:#e67e22; width:50%;" class="btn-secondary">🚫 Ban</button>
                    <button onclick="adminBanUser(false)" style="background:#2ecc71; width:50%;" class="btn-secondary">✅ Unban</button>
                </div>

                <button onclick="adminDeleteUser()" style="background:#ff4757; width:100%; font-weight:bold; margin-bottom:6px;" class="btn-secondary">🗑️ Delete User & Posts</button>
                <button onclick="adminInspectUser()" style="background:#8e44ad; width:100%; font-weight:bold;" class="btn-secondary">🔍 Inspect Full Profile</button>
            </div>
        </nav>

        <main class="feed">
            <div class="tab-bar">
                <div class="tab active" id="tabHome">Feed</div>
            </div>

            <div style="padding: 12px 16px; border-bottom: 1px solid var(--border-color);">
                <input type="text" id="searchInput" class="composer-input-extra" 
                       placeholder="🔍 Search users, posts, or blogs..." 
                       onkeyup="handleSearch(event)" style="margin-bottom: 0;">
            </div>

            <div class="composer">
                <textarea id="postContent" placeholder="What is happening?!"></textarea>
                
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px;">
                    <input type="file" id="filePicker" accept="image/*,video/*,audio/*" style="display: none;" onchange="uploadFile()">
                    <button class="btn-secondary" onclick="document.getElementById('filePicker').click()">📁 Attach Photo/Video/Music</button>
                    <span id="fileUploadStatus" style="font-size: 12px; color: var(--accent-color);"></span>
                </div>

                <input type="hidden" id="uploadedMediaUrl">

                <div style="display: flex; justify-content: flex-end;">
                    <button class="btn-primary" style="width: auto; padding: 8px 24px;" onclick="submitPost()">Post</button>
                </div>
            </div>

            <div id="feedContainer"></div>
        </main>
    </div>

    <div id="profileModal" class="modal-overlay">
        <div class="modal">
            <h2>Edit Profile & Status</h2>
            
            <label style="font-size: 12px; color: var(--text-muted);">Profile Picture (Selected from Storage)</label>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px; margin-top: 4px;">
                <input type="file" id="avatarPicker" accept="image/*" style="display: none;" onchange="uploadAvatarFile()">
                <button class="btn-secondary" onclick="document.getElementById('avatarPicker').click()">📷 Choose Picture from Device</button>
                <span id="avatarUploadStatus" style="font-size: 12px; color: var(--accent-color);"></span>
            </div>

            <input type="hidden" id="editAvatarUrl">

            <label style="font-size: 12px; color: var(--text-muted);">Bio / Status</label>
            <textarea id="editBio" class="composer-input-extra" style="height: 70px;" placeholder="Write your bio or current status..."></textarea>
            
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeProfileModal()">Cancel</button>
                <button class="btn-primary" style="width: auto;" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="blogModal" class="modal-overlay">
        <div class="modal">
            <h2>✍️ Write Blog Article</h2>
            <input type="text" id="blogTitle" class="composer-input-extra" placeholder="Article Title...">
            <input type="text" id="blogMediaUrl" class="composer-input-extra" placeholder="Cover Image URL (Optional)...">
            <textarea id="blogContent" class="composer-input-extra" style="height: 150px;" placeholder="Write your article content here..."></textarea>
            
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeBlogModal()">Cancel</button>
                <button class="btn-primary btn-blog" style="width: auto;" onclick="submitBlog()">Publish Article</button>
            </div>
        </div>
    </div>

    <div id="inspectModal" class="modal-overlay">
        <div class="modal">
            <h2 id="inspectName">User Profile</h2>
            <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 12px;">
                <img id="inspectAvatar" class="avatar" src="" alt="Avatar">
                <div>
                    <strong id="inspectHandle" style="font-size: 16px;"></strong>
                    <p id="inspectBio" style="font-size: 13px; color: var(--text-muted);"></p>
                </div>
            </div>
            
            <hr style="border-color: var(--border-color); margin-bottom: 12px;">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; margin-bottom: 12px;">
                <div><strong>Followers:</strong> <span id="inspectFollowersCount">0</span></div>
                <div><strong>Following:</strong> <span id="inspectFollowingCount">0</span></div>
                <div><strong>Total Posts:</strong> <span id="inspectPostsCount">0</span></div>
                <div><strong>Total Likes Received:</strong> <span id="inspectLikesCount">0</span></div>
            </div>

            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
                <strong>Followers List:</strong>
                <p id="inspectFollowersList" style="color: #fff; word-break: break-all; margin-top: 2px;"></p>
            </div>

            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
                <strong>Following List:</strong>
                <p id="inspectFollowingList" style="color: #fff; word-break: break-all; margin-top: 2px;"></p>
            </div>

            <div class="modal-actions">
                <button class="btn-secondary" onclick="document.getElementById('inspectModal').style.display='none'">Close</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://192.168.1.10:3000/api";
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        let isSignUpMode = false;

        const blueTickSVG = `
            <span style="display:inline-flex; align-items:center;">
                <svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align: middle;">
                    <path fill="#0095F6" d="M19.965 8.84c.413-1.552-.015-3.228-1.157-4.37-1.142-1.142-2.818-1.57-4.37-1.157C13.328 2.04 11.953 1.165 10.378 1.165s-2.95.875-3.66 2.148c-1.552-.413-3.228.015-4.37 1.157-1.142 1.142-1.57 2.818-1.157 4.37C.081 9.55-.794 10.925-.794 12.5s.875 2.95 2.148 3.66c-.413 1.552.015 3.228 1.157 4.37 1.142 1.142 2.818 1.57 4.37 1.157.71 1.273 2.085 2.148 3.66 2.148s2.95-.875 3.66-2.148c1.552.413 3.228-.015 4.37-1.157 1.142-1.142 1.57-2.818 1.157-4.37 1.273-.71 2.148-2.085 2.148-3.66s-.875-2.95-2.148-3.66z" transform="matrix(0.88 0 0 0.88 1.44 1.44)"/>
                    <path fill="#FFFFFF" d="M9.8 15.6l-3.5-3.5 1.4-1.4 2.1 2.1 6.1-6.1 1.4 1.4z"/>
                </svg>
            </span>
        `;

        function updateUIState() {
            if (currentUser) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('profileSection').style.display = 'block';
                document.getElementById('profileName').innerText = currentUser.displayName;
                document.getElementById('profileHandle').innerText = currentUser.username;
                document.getElementById('profileBio').innerText = currentUser.bio || "No status or bio set yet.";
                document.getElementById('profileAvatar').src = currentUser.avatarUrl || "https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png";
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('profileSection').style.display = 'none';
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "Sign Up" : "Login";
            document.getElementById('authBtn').innerText = isSignUpMode ? "Create Account" : "Log In";
            document.getElementById('authDisplayName').style.display = isSignUpMode ? "block" : "none";
            document.getElementById('authToggle').innerText = isSignUpMode ? "Already have an account? Log In" : "Don't have an account? Sign Up";
        }

        async function handleAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const displayName = document.getElementById('authDisplayName').value.trim();

            const endpoint = isSignUpMode ? '/auth/signup' : '/auth/login';
            const body = isSignUpMode ? { username, password, displayName } : { username, password };

            const res = await fetch(`${API_URL}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await res.json();
            if (!data.success) return alert(data.error);

            if (isSignUpMode) {
                alert("Account created! Logging in...");
                toggleAuthMode();
            } else {
                currentUser = data.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateUIState();
                loadPosts();
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            updateUIState();
            loadPosts();
        }

        function openProfileModal() {
            document.getElementById('editAvatarUrl').value = currentUser.avatarUrl || '';
            document.getElementById('editBio').value = currentUser.bio || '';
            document.getElementById('avatarUploadStatus').innerText = '';
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfileModal() { 
            document.getElementById('profileModal').style.display = 'none'; 
        }

        async function uploadAvatarFile() {
            const fileInput = document.getElementById('avatarPicker');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            document.getElementById('avatarUploadStatus').innerText = "Uploading photo...";

            try {
                const res = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (data.success) {
                    document.getElementById('editAvatarUrl').value = data.fileUrl;
                    document.getElementById('avatarUploadStatus').innerText = "✅ Image uploaded!";
                } else {
                    document.getElementById('avatarUploadStatus').innerText = "❌ " + (data.error || "Upload failed");
                }
            } catch (err) {
                console.error("Avatar upload error:", err);
                document.getElementById('avatarUploadStatus').innerText = "❌ Network Error uploading photo";
            }
        }

        async function saveProfile() {
            const avatarUrl = document.getElementById('editAvatarUrl').value.trim();
            const bio = document.getElementById('editBio').value.trim();

            const res = await fetch(`${API_URL}/user/profile`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    handle: currentUser.username, 
                    avatarUrl: avatarUrl || currentUser.avatarUrl, 
                    bio 
                })
            });

            const data = await res.json();
            if (data.success) {
                currentUser.avatarUrl = data.user.avatarUrl;
                currentUser.bio = data.user.bio;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateUIState();
                closeProfileModal();
                loadPosts();
                alert("Profile updated successfully!");
            } else {
                alert(data.error || "Failed to save profile.");
            }
        }

        function openBlogModal() { document.getElementById('blogModal').style.display = 'flex'; }
        function closeBlogModal() { document.getElementById('blogModal').style.display = 'none'; }

        async function submitBlog() {
            const title = document.getElementById('blogTitle').value.trim();
            const mediaUrl = document.getElementById('blogMediaUrl').value.trim();
            const content = document.getElementById('blogContent').value.trim();

            if (!title || !content) return alert("Article title and content are required!");

            await fetch(`${API_URL}/posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    author: currentUser.displayName,
                    handle: currentUser.username,
                    postType: 'blog',
                    title: title,
                    content: content,
                    mediaUrl: mediaUrl
                })
            });

            closeBlogModal();
            document.getElementById('blogTitle').value = '';
            document.getElementById('blogMediaUrl').value = '';
            document.getElementById('blogContent').value = '';
            loadPosts();
        }

        async function uploadFile() {
            const fileInput = document.getElementById('filePicker');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            document.getElementById('fileUploadStatus').innerText = "Uploading...";

            try {
                const res = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (data.success) {
                    document.getElementById('uploadedMediaUrl').value = data.fileUrl;
                    document.getElementById('fileUploadStatus').innerText = "✅ Uploaded!";
                } else {
                    document.getElementById('fileUploadStatus').innerText = "❌ " + (data.error || "Upload failed");
                }
            } catch (err) {
                console.error("Upload error:", err);
                document.getElementById('fileUploadStatus').innerText = "❌ Network Error uploading file";
            }
        }

        async function submitPost() {
            if (!currentUser) return alert("Please log in first!");

            const content = document.getElementById('postContent').value.trim();
            const mediaUrl = document.getElementById('uploadedMediaUrl').value.trim();

            if (!content && !mediaUrl) return alert("Post cannot be empty!");

            const res = await fetch(`${API_URL}/posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    author: currentUser.displayName,
                    handle: currentUser.username,
                    content: content,
                    mediaUrl: mediaUrl,
                    postType: 'post'
                })
            });

            const data = await res.json();
            if (data.success) {
                document.getElementById('postContent').value = '';
                document.getElementById('uploadedMediaUrl').value = '';
                document.getElementById('fileUploadStatus').innerText = '';
                const filePicker = document.getElementById('filePicker');
                if (filePicker) filePicker.value = '';
                
                loadPosts();
            } else {
                alert(data.error || "Failed to create post");
            }
        }

        async function followUser(targetHandle) {
            if (!currentUser) return alert("Please log in first!");

            const res = await fetch(`${API_URL}/user/follow`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    currentHandle: currentUser.username,
                    targetHandle: targetHandle
                })
            });

            const data = await res.json();
            if (data.success) {
                currentUser.following = data.following;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                loadPosts();
            }
        }

        async function likePost(id) {
            if (!currentUser) return alert("Log in to like posts!");
            await fetch(`${API_URL}/posts/${id}/like`, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle: currentUser.username })
            });
            loadPosts();
        }

        async function toggleComments(postId) {
            const commentDiv = document.getElementById(`comments-${postId}`);
            if (commentDiv.style.display === 'none') {
                commentDiv.style.display = 'block';
                fetchComments(postId);
            } else {
                commentDiv.style.display = 'none';
            }
        }

        async function fetchComments(postId) {
            const res = await fetch(`${API_URL}/posts/${postId}/comments`);
            const comments = await res.json();
            const listDiv = document.getElementById(`comment-list-${postId}`);
            listDiv.innerHTML = '';

            comments.forEach(c => {
                listDiv.innerHTML += `
                    <div class="comment-item">
                        <img src="${c.avatarUrl || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png'}" class="comment-avatar">
                        <div class="comment-box">
                            <strong>${c.author}</strong> <span style="color:#71767b;">${c.handle}</span>
                            <div>${c.content}</div>
                        </div>
                    </div>
                `;
            });
        }

        async function addComment(postId) {
            if (!currentUser) return alert("Log in to comment!");
            const input = document.getElementById(`input-comment-${postId}`);
            const content = input.value.trim();
            if (!content) return;

            await fetch(`${API_URL}/posts/${postId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    author: currentUser.displayName,
                    handle: currentUser.username,
                    content
                })
            });

            input.value = '';
            fetchComments(postId);
        }

        async function handleSearch(event) {
            const query = document.getElementById('searchInput').value.trim();

            if (query === '') {
                loadPosts();
                return;
            }

            const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();

            if (data.success) {
                renderSearchResults(data.users, data.posts);
            }
        }

        function renderSearchResults(users, posts) {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            if (users.length > 0) {
                container.innerHTML += `<h3 style="padding: 12px; color: var(--accent-color);">Matching Users (${users.length})</h3>`;
                users.forEach(user => {
                    container.innerHTML += `
                        <div class="post" style="align-items: center;">
                            <img src="${user.avatarUrl || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png'}" class="avatar">
                            <div style="flex:1;">
                                <strong>${user.displayName}</strong> ${user.isVerified ? blueTickSVG : ''} 
                                <span style="color:var(--text-muted);">${user.username}</span>
                                <p style="font-size:12px; color:#ccc;">${user.bio || 'No status available'}</p>
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML += `<h3 style="padding: 12px; color: var(--accent-color);">Matching Posts (${posts.length})</h3>`;

            if (posts.length === 0 && users.length === 0) {
                container.innerHTML += `<p style="padding: 16px; color: var(--text-muted);">No results found.</p>`;
                return;
            }

            posts.forEach(post => {
                const isBlog = post.postType === 'blog';
                container.innerHTML += `
                    <article class="post">
                        <img src="${post.avatarUrl || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png'}" class="avatar">
                        <div class="post-body">
                            <div class="post-header">
                                <span class="author">${post.author}</span>
                                ${post.isVerified ? blueTickSVG : ''}
                                <span class="handle">${post.handle}</span>
                                ${isBlog ? '<span class="blog-badge">BLOG</span>' : ''}
                            </div>
                            ${isBlog ? `<h2 class="post-title">${post.title}</h2>` : ''}
                            <div class="post-content">${post.content}</div>
                        </div>
                    </article>
                `;
            });
        }

        async function loadPosts() {
            try {
                const res = await fetch(`${API_URL}/posts`);
                const posts = await res.json();
                const container = document.getElementById('feedContainer');
                container.innerHTML = '';

                for (const post of posts) {
                    let mediaHTML = '';
                    if (post.mediaUrl) {
                        if (post.mediaUrl.match(/\.(mp4|webm)$/i)) {
                            mediaHTML = `<video src="${post.mediaUrl}" controls class="post-media"></video>`;
                        } else if (post.mediaUrl.match(/\.(mp3|wav|ogg)$/i)) {
                            mediaHTML = `<audio src="${post.mediaUrl}" controls style="width:100%; margin-top:10px;"></audio>`;
                        } else {
                            mediaHTML = `<img src="${post.mediaUrl}" class="post-media" alt="Post Media">`;
                        }
                    }

                    const isBlog = post.postType === 'blog';
                    const isFollowing = currentUser && Array.isArray(currentUser.following) && currentUser.following.includes(post.handle);
                    const isSelf = currentUser && currentUser.username === post.handle;

                    let followBtnHTML = '';
                    if (currentUser && !isSelf) {
                        followBtnHTML = `
                            <button class="tiktok-follow-btn ${isFollowing ? 'following' : ''}" 
                                    onclick="followUser('${post.handle}')">
                                ${isFollowing ? 'Following' : '+ Follow'}
                            </button>
                        `;
                    }

                    container.innerHTML += `
                        <article class="post">
                            <img src="${post.avatarUrl || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png'}" class="avatar">
                            <div class="post-body">
                                <div class="post-header" style="display:flex; align-items:center; width:100%;">
                                    <span class="author">${post.author}</span>
                                    ${post.isVerified ? blueTickSVG : ''}
                                    <span class="handle">${post.handle}</span>
                                    ${isBlog ? '<span class="blog-badge">BLOG</span>' : ''}
                                    ${followBtnHTML}
                                </div>
                                ${isBlog ? `<h2 class="post-title">${post.title}</h2>` : ''}
                                <div class="post-content">${post.content}</div>
                                ${mediaHTML}
                                <div class="post-actions">
                                    <span class="like-btn" onclick="likePost('${post._id}')">❤️ ${post.likes || 0}</span>
                                    <span class="comment-btn" onclick="toggleComments('${post._id}')">💬 Comments</span>
                                    <span onclick="adminDeletePost('${post._id}')" style="cursor:pointer; color:#ff4757; font-size:12px; margin-left:auto;">🗑️ Admin Delete</span>
                                </div>

                                <div id="comments-${post._id}" class="comments-section" style="display:none;">
                                    <div id="comment-list-${post._id}"></div>
                                    <div style="display:flex; gap:5px; margin-top:8px;">
                                        <input type="text" id="input-comment-${post._id}" class="composer-input-extra" placeholder="Write a comment..." style="margin:0;">
                                        <button onclick="addComment('${post._id}')" class="btn-primary" style="width:auto; padding:0 15px;">Send</button>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                }
            } catch (err) {
                console.error("Failed to load feed:", err);
            }
        }

        // --- ADMIN FUNCTIONS ---

        async function toggleVerification(status) {
            const handle = document.getElementById('adminHandle').value.trim();
            if (!handle) return alert("Enter target handle!");

            const res = await fetch(`${API_URL}/admin/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle, isVerified: status })
            });

            const data = await res.json();
            alert(data.message);
            loadPosts();
        }

        async function adminBanUser(status) {
            const handle = document.getElementById('adminHandle').value.trim();
            if (!handle) return alert("Please enter a target handle!");

            const action = status ? "BAN" : "UNBAN";
            if (!confirm(`Are you sure you want to ${action} ${handle}?`)) return;

            const res = await fetch(`${API_URL}/admin/ban`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle, isBanned: status })
            });

            const data = await res.json();
            alert(data.message || data.error);
            loadPosts();
        }

        async function adminDeleteUser() {
            const handle = document.getElementById('adminHandle').value.trim();
            if (!handle) return alert("Please enter a target handle!");

            if (!confirm(`⚠️ PERMANENT ACTION:\nAre you sure you want to delete user ${handle} and ALL their posts?`)) return;

            const res = await fetch(`${API_URL}/admin/delete-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle })
            });

            const data = await res.json();
            alert(data.message || data.error);
            loadPosts();
        }

        async function adminDeletePost(postId) {
            if (!confirm("Are you sure you want to delete this post?")) return;

            const res = await fetch(`${API_URL}/admin/posts/${postId}`, {
                method: 'DELETE'
            });

            const data = await res.json();
            if (data.success) {
                loadPosts();
            } else {
                alert(data.error || "Failed to delete post");
            }
        }

        async function adminInspectUser() {
            const handle = document.getElementById('adminHandle').value.trim();
            if (!handle) return alert("Please enter a target handle in the Admin box!");

            const res = await fetch(`${API_URL}/admin/user/${encodeURIComponent(handle)}`);
            const data = await res.json();

            if (!data.success) return alert(data.error || "User not found");

            const u = data.user;
            document.getElementById('inspectName').innerText = `${u.displayName} ${u.isVerified ? '☑️' : ''} ${u.isBanned ? '🚫 (Banned)' : ''}`;
            document.getElementById('inspectHandle').innerText = u.username;
            document.getElementById('inspectAvatar').src = u.avatarUrl || 'https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png';
            document.getElementById('inspectBio').innerText = u.bio || 'No bio set';
            
            document.getElementById('inspectFollowersCount').innerText = u.followersCount;
            document.getElementById('inspectFollowingCount').innerText = u.followingCount;
            document.getElementById('inspectPostsCount').innerText = u.totalPosts;
            document.getElementById('inspectLikesCount').innerText = u.totalLikesReceived;

            document.getElementById('inspectFollowersList').innerText = u.followersList.length > 0 ? u.followersList.join(', ') : 'None';
            document.getElementById('inspectFollowingList').innerText = u.followingList.length > 0 ? u.followingList.join(', ') : 'None';

            document.getElementById('inspectModal').style.display = 'flex';
        }

        // Initialize state
        updateUIState();
        loadPosts();
    </script>
</body>
</html>
